[package]
name = "stverify"
version = "0.2.3"
edition = "2021"
description = "Zero-bloat parallel cryptographic signer and verifier for safetensors model shards"
license = "MIT"
repository = "https://github.com/foxhackerzdevs/stverify"
homepage = "https://github.com/foxhackerzdevs/stverify"
documentation = "https://docs.rs/stverify"
readme = "README.md"
keywords = ["safetensors", "ed25519", "cryptography", "llm", "security"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "stverify"
path = "src/lib.rs"

[[bin]]
name = "stverify"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
