name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose

  build-release:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            artifact_name: stverify-linux-x86_64-musl
            experimental: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            artifact_name: stverify-linux-aarch64-musl
            experimental: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            artifact_name: stverify-windows-x86_64.exe
            experimental: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            artifact_name: stverify-macos-aarch64
            experimental: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            artifact_name: stverify-macos-x86_64
            experimental: true

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Artifact
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/stverify"
          if [ -f "${BIN_PATH}.exe" ]; then
            cp "${BIN_PATH}.exe" "${{ matrix.artifact_name }}"
          else
            cp "${BIN_PATH}" "${{ matrix.artifact_name }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  docker-release:
    name: Build & Push GHCR Container
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish Release Assets
    needs: [build-release, docker-release]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Attach Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --generate-notes
          if [ -d release-artifacts ] && [ "$(ls -A release-artifacts 2>/dev/null)" ]; then
            gh release upload ${{ github.ref_name }} release-artifacts/* --clobber
          fi
